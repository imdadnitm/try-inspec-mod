name: Test Suite

on:
  push:
    branches: [main, "learn/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make test scripts executable
        run: |
          chmod +x tests/*.sh

      - name: Run test suite
        run: bash tests/run-tests.sh
        
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.json
          retention-days: 30
